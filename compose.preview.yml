# Isolated development preview only. Never expose this unauthenticated stack publicly.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: preview
      POSTGRES_PASSWORD: local-preview-only
      POSTGRES_DB: mgts
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U preview -d mgts']
      interval: 3s
      timeout: 3s
      retries: 30
  schema-init:
    image: postgres:15-alpine
    command: [psql, -v, ON_ERROR_STOP=1, '-1', -f, /schema/schema.sql]
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGUSER: preview
      PGPASSWORD: local-preview-only
      PGDATABASE: mgts
    volumes:
      - ./backend/sql/schema.sql:/schema/schema.sql:ro
    depends_on:
      db:
        condition: service_healthy
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data
    environment:
      MINIO_ROOT_USER: preview
      MINIO_ROOT_PASSWORD: local-preview-only
    volumes:
      - photos:/data
  backend:
    build: ./backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: preview
      DB_PASSWORD: local-preview-only
      DB_NAME: mgts
      AUTH_REQUIRED: 'false'
      JWT_SECRET: isolated-preview-only-not-for-production-0000
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: preview
      S3_SECRET_KEY: local-preview-only
      S3_BUCKET: mgts-preview
      UPLOADS_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
      schema-init:
        condition: service_completed_successfully
    restart: on-failure:5
    healthcheck:
      test: [CMD, python, '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 15s
  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000/api
      NUXT_PUBLIC_DEMO_MODE: 'false'
    ports:
      - '127.0.0.1:${MGTS_PREVIEW_PORT:-3300}:3000'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, '-e', "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s
volumes:
  db:
  photos:
  uploads:
